<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>이게 뭐예요?</title>
<style>
  :root{
    --bg:#0d1a17; --card:#152823; --card2:#1e3a32; --line:#2c4d43;
    --txt:#e8f7f0; --sub:#9fccba; --accent:#27c08a; --accent2:#ffb85b; --bad:#ff7a7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
  header h1{font-size:17px;margin:0;font-weight:700;flex:1}
  .iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .bar{display:flex;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
  .bar button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:13px;font-weight:700;cursor:pointer}
  .bar button.on{background:var(--accent);color:#06231a;border-color:var(--accent)}
  .camwrap{position:relative;background:#000;flex-shrink:0;border-bottom:1px solid var(--line)}
  #video{width:100%;max-height:42dvh;object-fit:cover;display:block}
  #shot{width:100%;max-height:42dvh;object-fit:contain;display:none;background:#000}
  .camhint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none}
  #feed{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:95%;padding:10px 13px;border-radius:13px;font-size:14px;line-height:1.5;white-space:pre-wrap}
  .sys{align-self:center;color:var(--sub);font-size:12.5px;text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;align-self:stretch}
  .word{font-size:24px;font-weight:700}
  .reading{font-size:15px;color:var(--accent2);font-weight:700;margin-left:6px}
  .ko{font-size:14px;color:var(--sub);margin-top:2px}
  .ex{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13.5px}
  .ex .jp{font-weight:600}
  .ex .exko{color:var(--sub);font-size:12.5px;margin-top:2px}
  .speak{display:inline-block;margin-left:8px;cursor:pointer;opacity:.8;font-size:15px}
  .line-o{font-size:16px;font-weight:600}
  .line-k{color:var(--accent2);font-size:15px;margin-top:4px}
  footer{padding:12px;background:var(--card);border-top:1px solid var(--line);flex-shrink:0;display:flex;gap:9px;align-items:center}
  #shoot{flex:1;height:58px;border-radius:15px;border:none;background:var(--accent);color:#06231a;font-size:17px;font-weight:800;cursor:pointer}
  #shoot:disabled{opacity:.5}
  .sidebtn{width:58px;height:58px;border-radius:15px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:22px;cursor:pointer}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
  .overlay.on{display:flex}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:88dvh;overflow-y:auto}
  .panel h2{margin:0 0 12px;font-size:16px}
  .panel label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px;font-weight:600}
  .panel input,.panel select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px}
  .panel .note{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.45}
  .panel button{width:100%;margin-top:16px;padding:13px;border-radius:11px;border:none;background:var(--accent);color:#06231a;font-weight:800;font-size:15px;cursor:pointer}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>📷 이게 뭐예요?</h1>
  <button class="iconbtn" id="setbtn" title="설정">⚙️</button>
</header>

<div class="bar">
  <button data-mode="id" class="on">🌸 알아보기</button>
  <button data-mode="word">🔤 단어</button>
  <button data-mode="text">📄 번역</button>
  <span id="langgrp" style="display:none;gap:6px">
    <button data-lang="ja" class="on" id="bja">🇯🇵</button>
    <button data-lang="en" id="ben">🇺🇸</button>
  </span>
</div>

<div class="camwrap">
  <video id="video" playsinline muted></video>
  <img id="shot" alt="">
  <div class="camhint" id="camhint">카메라 준비 중...</div>
</div>

<div id="feed"></div>

<footer>
  <button class="sidebtn" id="galbtn" title="갤러리에서 선택">🖼️</button>
  <button id="shoot">📷 찍어서 알아보기</button>
  <button class="sidebtn" id="retry" title="다시 카메라" style="display:none">🔄</button>
</footer>
<input type="file" id="file" accept="image/*" capture="environment" style="display:none">
<canvas id="canvas" style="display:none"></canvas>

<div class="overlay" id="setpanel">
  <div class="panel">
    <h2>⚙️ 설정</h2>
    <div class="note">🔑 API 키는 스피킹 코치 앱과 공유돼요. 사진은 작게 줄여서(최대 768px) 보내므로 토큰이 거의 안 듭니다.</div>
    <label>AI 제공자</label>
    <select id="provider">
      <option value="gemini">Google Gemini (개인 키, 무료한도 넉넉)</option>
      <option value="claude">Anthropic Claude</option>
    </select>
    <label id="keylabel">Gemini API 키</label>
    <input type="password" id="apikey" placeholder="키 입력">
    <div class="note" id="keynote"></div>
    <label>모델 (비전 지원 모델)</label>
    <select id="model"></select>
    <button id="savebtn">저장</button>
    <button id="testbtn" style="background:var(--card2);border:1px solid var(--line);color:var(--txt);margin-top:8px">🔌 연결 테스트</button>
    <div class="note" id="testresult" style="margin-top:8px"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), feed=$('#feed'), video=$('#video'), shot=$('#shot'), canvas=$('#canvas');
const cfg={
  provider:localStorage.getItem('sc_provider')||'gemini',
  keyGemini:localStorage.getItem('sc_key_gemini')||'',
  keyClaude:localStorage.getItem('sc_key_claude')||'',
  modelGemini:localStorage.getItem('sc_model_gemini')||'gemini-2.5-flash',
  modelClaude:localStorage.getItem('sc_model_claude')||'claude-haiku-4-5-20251001',
  lang:localStorage.getItem('cam_lang')||'ja',
  mode:localStorage.getItem('cam_mode')||'id',
};
const MODELS={
  gemini:[['gemini-2.5-flash','Gemini 2.5 Flash — 추천'],['gemini-2.0-flash','Gemini 2.0 Flash'],['gemini-2.5-pro','Gemini 2.5 Pro — 똑똑·비쌈']],
  claude:[['claude-haiku-4-5-20251001','Claude Haiku 4.5'],['claude-sonnet-4-6','Claude Sonnet 4.6']]
};
const curKey=()=>cfg.provider==='gemini'?cfg.keyGemini:cfg.keyClaude;
const isJA=()=>cfg.lang==='ja';
let busy=false;

/* ---------- 출력 ---------- */
function sysmsg(t){const d=document.createElement('div');d.className='msg sys';d.textContent=t;feed.appendChild(d);feed.scrollTop=feed.scrollHeight;}
function clearFeed(){feed.innerHTML='';}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- TTS ---------- */
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices();}
loadVoices(); if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;
function speak(text,langOverride){
  if(!text)return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const want=langOverride||(isJA()?'ja-JP':'en-US'); u.lang=want; u.rate=0.9;
  const base=want.split('-')[0];
  const v=voices.find(v=>v.lang&&v.lang.replace('_','-')===want)||voices.find(v=>v.lang&&v.lang.toLowerCase().indexOf(base)===0);
  if(v)u.voice=v; speechSynthesis.speak(u);
}
function speakIcon(t,lang){const s=document.createElement('span');s.className='speak';s.textContent='🔊';s.onclick=()=>speak(t,lang);return s;}

/* ---------- 카메라 ---------- */
let stream=null;
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    video.srcObject=stream; await video.play();
    video.style.display='block'; shot.style.display='none';
    $('#camhint').textContent='물건을 화면에 담고 아래 버튼을 누르세요';
    $('#retry').style.display='none';
  }catch(e){
    $('#camhint').textContent='카메라를 못 열었어요 — 🖼️ 버튼으로 사진을 선택하세요';
  }
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}

function frameToData(srcEl,w,h){
  const max=768; const scale=Math.min(1,max/Math.max(w,h));
  canvas.width=Math.round(w*scale); canvas.height=Math.round(h*scale);
  canvas.getContext('2d').drawImage(srcEl,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/jpeg',0.7);
}
$('#shoot').onclick=()=>{
  if(busy)return;
  if(!video.videoWidth){$('#camhint').textContent='카메라가 아직 준비 안 됐어요. 🖼️로 사진을 선택해도 돼요';return;}
  const data=frameToData(video,video.videoWidth,video.videoHeight);
  showShot(data); analyze(data);
};
$('#galbtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const img=new Image();
  img.onload=()=>{const data=frameToData(img,img.naturalWidth,img.naturalHeight);showShot(data);analyze(data);};
  img.src=URL.createObjectURL(f);
};
$('#retry').onclick=()=>{startCam();};
function showShot(data){
  stopCam();
  shot.src=data; shot.style.display='block'; video.style.display='none';
  $('#camhint').textContent=''; $('#retry').style.display='';
}

/* ---------- 비전 API ---------- */
function dataToB64(dataURL){return {mime:dataURL.slice(5,dataURL.indexOf(';')),b64:dataURL.slice(dataURL.indexOf(',')+1)};}
async function askVision(dataURL,prompt,maxTok=600){
  if(!curKey())throw new Error('NO_KEY');
  const {mime,b64}=dataToB64(dataURL);
  return cfg.provider==='gemini'?visGemini(mime,b64,prompt,maxTok):visClaude(mime,b64,prompt,maxTok);
}
async function visGemini(mime,b64,prompt,maxTok){
  const model=cfg.modelGemini;
  const gc={maxOutputTokens:maxTok,responseMimeType:'application/json'};
  if(/flash/.test(model))gc.thinkingConfig={thinkingBudget:0};
  const body={contents:[{role:'user',parts:[{inlineData:{mimeType:mime,data:b64}},{text:prompt}]}],generationConfig:gc};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cfg.keyGemini)}`,{
    method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error('Gemini '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}
async function visClaude(mime,b64,prompt,maxTok){
  const body={model:cfg.modelClaude,max_tokens:maxTok,messages:[{role:'user',content:[
    {type:'image',source:{type:'base64',media_type:mime,data:b64}},{type:'text',text:prompt}]}]};
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':cfg.keyClaude,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error('Claude '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return d.content.map(c=>c.text||'').join('');
}
function parseJSON(s){try{return JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1));}catch(e){return null;}}

/* ---------- 분석 ---------- */
async function analyze(dataURL){
  if(!curKey()){sysmsg('⚙️ 설정에서 API 키를 먼저 입력하세요.');$('#setpanel').classList.add('on');return;}
  busy=true;$('#shoot').disabled=true;
  clearFeed();sysmsg('🔎 분석 중...');
  const Ln=isJA()?'Japanese':'English';
  try{
    let prompt;
    if(cfg.mode==='id'){
      prompt=`You are a friendly guide who answers in KOREAN. Look at the photo and identify what it is. If it is a flower or plant, identify the species as specifically as you can. Reply ONLY JSON (all text in Korean, except scientific or foreign names): {"name":"<한국어 이름>","also":"<학명 또는 영어/일본어 이름, 모르면 빈칸>","desc":"<무엇인지 1~2문장 설명>","facts":["<특징이나 재미있는 점>"],"flower":{"meaning":"<꽃말, 꽃이 아니면 빈칸>","season":"<개화 또는 제철 시기>","care":"<간단한 관리 팁>"},"confidence":"<높음|보통|낮음>"}. Be honest in desc and confidence if you are not sure.`;
    }else if(cfg.mode==='word'){
      prompt=isJA()
        ? `You help a Korean learner of Japanese. Identify the 1-3 most prominent everyday objects in this photo. For each, give the natural Japanese word. Reply ONLY JSON: {"items":[{"word":"<日本語>","reading":"<Hepburn romaji>","ko":"<한국어 뜻>","ex":"<short natural Japanese example sentence>","ex_reading":"<romaji>","ex_ko":"<한국어 뜻>"}]}`
        : `You help a Korean learner of English. Identify the 1-3 most prominent everyday objects in this photo. Reply ONLY JSON: {"items":[{"word":"<English word>","reading":"","ko":"<한국어 뜻>","ex":"<short example sentence>","ex_reading":"","ex_ko":"<한국어 뜻>"}]}`;
    }else{
      prompt=`Read ALL text visible in this image (menu, sign, label, etc.). For each line or block, give the original text and a natural Korean translation.${isJA()?' If it is Japanese, also give Hepburn romaji.':''} Reply ONLY JSON: {"lines":[{"original":"<원문>","reading":"<romaji or empty>","ko":"<한국어 번역>"}]}. If there is no readable text, return {"lines":[]}.`;
    }
    const out=await askVision(dataURL,prompt,700);
    const j=parseJSON(out);
    busy=false;$('#shoot').disabled=false;
    clearFeed();
    if(!j){sysmsg('결과를 못 읽었어요. 다시 찍어보세요.\n'+out.slice(0,120));return;}
    if(cfg.mode==='id') renderId(j);
    else if(cfg.mode==='word') renderWords(j.items||[]);
    else renderText(j.lines||[]);
  }catch(e){
    busy=false;$('#shoot').disabled=false;clearFeed();
    const m=String(e.message);
    if(m.includes('NO_KEY')){sysmsg('⚙️ API 키를 입력하세요.');$('#setpanel').classList.add('on');}
    else if(m.includes('Failed to fetch')) sysmsg('연결 실패. VPN/사설DNS/광고차단을 끄고 다시 시도하세요.');
    else sysmsg('오류: '+m);
  }
}
function renderId(j){
  if(!j||!j.name){sysmsg('잘 못 알아봤어요. 더 가까이/밝게 다시 찍어보세요.');return;}
  const c=document.createElement('div');c.className='card';
  let h=`<div><span class="word">${esc(j.name)}</span></div>`;
  if(j.also)h+=`<div class="ko" style="font-style:italic">${esc(j.also)}</div>`;
  if(j.desc)h+=`<div style="margin-top:8px;font-size:14.5px;line-height:1.6">${esc(j.desc)}</div>`;
  if(Array.isArray(j.facts)&&j.facts.length)h+=`<ul style="margin:9px 0 0;padding-left:18px;font-size:13.5px;color:var(--sub);line-height:1.65">${j.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`;
  const fl=j.flower||{};
  if(fl.meaning||fl.season||fl.care){
    h+=`<div class="ex">`;
    if(fl.meaning)h+=`<div>🌸 <b>꽃말</b> · ${esc(fl.meaning)}</div>`;
    if(fl.season)h+=`<div style="margin-top:4px">📅 <b>시기</b> · ${esc(fl.season)}</div>`;
    if(fl.care)h+=`<div style="margin-top:4px">💧 <b>관리</b> · ${esc(fl.care)}</div>`;
    h+=`</div>`;
  }
  if(j.confidence)h+=`<div class="ko" style="margin-top:9px;font-size:12px">🤔 확신도: ${esc(j.confidence)}</div>`;
  c.innerHTML=h;
  c.querySelector('.word').after(speakIcon(j.name,'ko-KR'));
  feed.appendChild(c);feed.scrollTop=0;
  speak(j.name,'ko-KR');
}
function renderWords(items){
  if(!items.length){sysmsg('물건을 잘 못 알아봤어요. 더 가까이/밝게 찍어보세요.');return;}
  items.forEach(it=>{
    const c=document.createElement('div');c.className='card';
    let h=`<div><span class="word">${esc(it.word)}</span>${it.reading?`<span class="reading">${esc(it.reading)}</span>`:''}</div>`
      +`<div class="ko">${esc(it.ko)}</div>`;
    if(it.ex)h+=`<div class="ex"><span class="jp">${esc(it.ex)}</span>${it.ex_reading?` <span style="color:var(--sub);font-size:12px">${esc(it.ex_reading)}</span>`:''}<div class="exko">${esc(it.ex_ko||'')}</div></div>`;
    c.innerHTML=h;
    const sp=speakIcon(it.word);c.querySelector('.word').after(sp);
    if(it.ex){const e2=speakIcon(it.ex);c.querySelector('.ex .jp').after(e2);}
    feed.appendChild(c);
  });
  feed.scrollTop=0;
  if(items[0]&&items[0].word)speak(items[0].word);
}
function renderText(lines){
  if(!lines.length){sysmsg('읽을 수 있는 글자를 못 찾았어요.');return;}
  lines.forEach(ln=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="line-o">${esc(ln.original)}${ln.reading?` <span style="color:var(--sub);font-size:13px">${esc(ln.reading)}</span>`:''}</div>`
      +`<div class="line-k">${esc(ln.ko)}</div>`;
    c.querySelector('.line-o').after(speakIcon(ln.original));
    feed.appendChild(c);
  });
  feed.scrollTop=0;
}

/* ---------- 토글 ---------- */
function updateBar(){
  $('#langgrp').style.display=cfg.mode==='id'?'none':'flex';
  $('#shoot').textContent={id:'📷 찍어서 알아보기',word:'📷 단어 알아보기',text:'📷 찍어서 번역하기'}[cfg.mode];
}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');cfg.mode=b.dataset.mode;localStorage.setItem('cam_mode',cfg.mode);
  updateBar();
});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-lang]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');cfg.lang=b.dataset.lang;localStorage.setItem('cam_lang',cfg.lang);
});

/* ---------- 설정 ---------- */
function fillModels(p){const sel=$('#model');sel.innerHTML='';MODELS[p].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o);});sel.value=p==='gemini'?cfg.modelGemini:cfg.modelClaude;}
function syncProviderUI(){
  const p=$('#provider').value;
  $('#keylabel').textContent=(p==='gemini'?'Gemini':'Claude')+' API 키';
  $('#apikey').value=p==='gemini'?cfg.keyGemini:cfg.keyClaude;
  $('#keynote').innerHTML=p==='gemini'?'<a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>에서 무료 발급. 다른 앱과 키 공유됨.':'<a href="https://console.anthropic.com/" target="_blank">console.anthropic.com</a>에서 발급. 다른 앱과 키 공유됨.';
  fillModels(p);
}
$('#provider').onchange=syncProviderUI;
$('#testbtn').onclick=async()=>{
  const note=$('#testresult');note.textContent='테스트 중...';
  cfg.provider=$('#provider').value;const k=$('#apikey').value.trim(),m=$('#model').value;
  if(cfg.provider==='gemini'){cfg.keyGemini=k;cfg.modelGemini=m;}else{cfg.keyClaude=k;cfg.modelClaude=m;}
  try{
    const body=cfg.provider==='gemini'
      ? fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(k)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:'reply ok'}]}],generationConfig:{maxOutputTokens:10,thinkingConfig:{thinkingBudget:0}}})})
      : fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m,max_tokens:10,messages:[{role:'user',content:'reply ok'}]})});
    const r=await body; note.textContent=r.ok?'✅ 연결 성공!':('❌ '+r.status+' '+(await r.text()).slice(0,80));
  }catch(e){const msg=String(e.message);note.textContent='❌ '+msg+(msg.includes('Failed to fetch')?' → VPN·사설DNS·광고차단 가능성':'');}
};
$('#setbtn').onclick=()=>{$('#provider').value=cfg.provider;syncProviderUI();$('#setpanel').classList.add('on');};
$('#setpanel').onclick=e=>{if(e.target.id==='setpanel')e.currentTarget.classList.remove('on');};
$('#savebtn').onclick=()=>{
  cfg.provider=$('#provider').value;const k=$('#apikey').value.trim(),m=$('#model').value;
  if(cfg.provider==='gemini'){cfg.keyGemini=k;cfg.modelGemini=m;}else{cfg.keyClaude=k;cfg.modelClaude=m;}
  localStorage.setItem('sc_provider',cfg.provider);
  localStorage.setItem('sc_key_gemini',cfg.keyGemini);localStorage.setItem('sc_key_claude',cfg.keyClaude);
  localStorage.setItem('sc_model_gemini',cfg.modelGemini);localStorage.setItem('sc_model_claude',cfg.modelClaude);
  $('#setpanel').classList.remove('on');
  if(curKey())sysmsg('키 저장 완료! 📷 찍어보세요.');
};

/* 시작 */
document.querySelector(`[data-lang="${cfg.lang}"]`)?.classList.add('on');
document.querySelector(`[data-lang="${cfg.lang==='ja'?'en':'ja'}"]`)?.classList.remove('on');
document.querySelector(`[data-mode="${cfg.mode}"]`)?.click();
sysmsg('📷 이게 뭐예요? v1\n🌸 꽃이나 물건을 찍으면 한국어로 무엇인지 + 설명을 알려줘요.\n꽃이면 이름·꽃말·개화시기·관리팁까지!\n(🔤 단어·📄 번역 모드는 일본어/영어로 전환)');
if(!curKey())sysmsg('⚙️ 먼저 API 키를 입력하세요 (스피킹 코치 앱과 공유됨).');
startCam();
</script>
