<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>일본어 스피킹 코치</title>
<style>
  :root{
    --bg:#1a1018; --card:#2a1c28; --card2:#3a2636; --line:#4a3144;
    --txt:#f7e8f0; --sub:#cca0bc; --accent:#ff5b8c; --accent2:#ffb85b;
    --warn:#ffb85b; --bad:#ff7a7a; --good:#3fd0a3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans",sans-serif;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
  header h1{font-size:17px;margin:0;font-weight:700;flex:1}
  .iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .modes{display:flex;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
  .modes button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:12.5px;font-weight:600;cursor:pointer;line-height:1.3}
  .modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #feed{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:90%;padding:11px 13px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .sys{align-self:center;color:var(--sub);font-size:12.5px;background:transparent;text-align:center;max-width:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;align-self:flex-start;max-width:95%;font-size:14px;line-height:1.55}
  .card .row{display:flex;gap:7px;margin:5px 0;align-items:flex-start}
  .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;margin-top:1px}
  .t-nat{background:rgba(63,208,163,.18);color:var(--good)}
  .t-gram{background:rgba(255,184,91,.18);color:var(--warn)}
  .t-tip{background:rgba(255,91,140,.18);color:var(--accent)}
  .t-say{background:rgba(255,122,122,.16);color:var(--bad)}
  .romaji{font-weight:700;font-size:16px}
  .jp{color:var(--sub);font-size:14px;margin-left:2px}
  .ko{color:var(--sub);font-size:13px;margin-top:3px}
  .speak{display:inline-block;margin-left:6px;cursor:pointer;opacity:.7;font-size:13px}
  footer{padding:12px;background:var(--card);border-top:1px solid var(--line);flex-shrink:0}
  .hint{text-align:center;color:var(--sub);font-size:12.5px;min-height:17px;margin-bottom:9px}
  .controls{display:flex;gap:9px;align-items:center}
  #micbtn{flex:1;height:56px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  #micbtn.rec{background:var(--bad);animation:pulse 1.1s infinite}
  #micbtn:disabled{opacity:.45}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02);filter:brightness(1.12)}}
  .sidebtn{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:20px;cursor:pointer}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
  .overlay.on{display:flex}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:88dvh;overflow-y:auto}
  .panel h2{margin:0 0 14px;font-size:16px}
  .panel label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px;font-weight:600}
  .panel input,.panel select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px}
  .panel .note{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.45}
  .panel button{width:100%;margin-top:16px;padding:13px;border-radius:11px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>🇯🇵 일본어 스피킹 코치</h1>
  <button class="iconbtn" id="speedbtn" title="읽기 속도">🐢</button>
  <button class="iconbtn" id="setbtn" title="설정">⚙️</button>
</header>

<div class="modes">
  <button data-mode="shadow" class="on">🔁 섀도잉</button>
  <button data-mode="express">💡 표현연습</button>
  <button data-mode="qa">💬 회화</button>
</div>

<div id="feed"></div>

<footer>
  <div class="hint" id="hint">아래 버튼을 눌러 시작하세요</div>
  <div class="controls">
    <button class="sidebtn" id="nextbtn" title="다음 문제">⏭️</button>
    <button id="micbtn">🎤 시작</button>
    <button class="sidebtn" id="replaybtn" title="다시 듣기">🔊</button>
  </div>
</footer>

<div class="overlay" id="setpanel">
  <div class="panel">
    <h2>⚙️ 설정</h2>
    <div class="note">🔑 API 키는 영어 앱과 공유돼요. 일본어는 글자를 못 읽어도 되게 <b>로마자 + 일본어 + 한국어 뜻</b>을 항상 같이 보여주고, 소리로 듣고 따라합니다. (모든 모드에 키 필요)</div>
    <label>AI 제공자</label>
    <select id="provider">
      <option value="gemini">Google Gemini (개인 키, 무료한도 넉넉)</option>
      <option value="claude">Anthropic Claude</option>
    </select>
    <label id="keylabel">Gemini API 키</label>
    <input type="password" id="apikey" placeholder="키 입력">
    <div class="note" id="keynote"></div>
    <label>모델</label>
    <select id="model"></select>
    <label>내 수준</label>
    <select id="level">
      <option value="beginner">초급 (아주 쉬운 문장, です/ます체)</option>
      <option value="intermediate">중급</option>
      <option value="advanced">고급</option>
    </select>
    <label>주제</label>
    <select id="topic">
      <option value="daily life">일상생활</option>
      <option value="travel in Japan">일본 여행</option>
      <option value="restaurants and food">음식/식당</option>
      <option value="shopping">쇼핑</option>
      <option value="self introduction">자기소개</option>
      <option value="hobbies and anime">취미/애니</option>
    </select>
    <button id="savebtn">저장</button>
    <button id="testbtn" style="background:var(--card2);border:1px solid var(--line);color:var(--txt);margin-top:8px">🔌 연결 테스트</button>
    <div class="note" id="testresult" style="margin-top:8px"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), feed=$('#feed');
// API 키/제공자/모델은 영어 앱(sc_*)과 공유, 수준·주제·속도만 일본어 전용(scja_*)
const cfg={
  provider:localStorage.getItem('sc_provider')||'gemini',
  keyGemini:localStorage.getItem('sc_key_gemini')||'',
  keyClaude:localStorage.getItem('sc_key_claude')||'',
  modelGemini:localStorage.getItem('sc_model_gemini')||'gemini-2.5-flash',
  modelClaude:localStorage.getItem('sc_model_claude')||'claude-haiku-4-5-20251001',
  level:localStorage.getItem('scja_level')||'beginner',
  topic:localStorage.getItem('scja_topic')||'daily life',
  rate:parseFloat(localStorage.getItem('scja_rate')||'0.85'),
};
const MODELS={
  gemini:[['gemini-2.5-flash','Gemini 2.5 Flash — 추천 (무료한도 넉넉)'],['gemini-2.0-flash','Gemini 2.0 Flash'],['gemini-2.5-pro','Gemini 2.5 Pro — 똑똑·비쌈']],
  claude:[['claude-haiku-4-5-20251001','Claude Haiku 4.5 — 저렴'],['claude-sonnet-4-6','Claude Sonnet 4.6 — 똑똑']]
};
const curKey=()=>cfg.provider==='gemini'?cfg.keyGemini:cfg.keyClaude;
let mode='shadow', history=[], busy=false, target='', tObj={say:'',read:'',ko:''};

/* ---------- 출력 ---------- */
function add(cls,txt){const d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;feed.appendChild(d);scroll();return d;}
function scroll(){feed.scrollTop=feed.scrollHeight;}
function sysmsg(t){add('sys',t);}
function speakIcon(text){const s=document.createElement('span');s.className='speak';s.textContent='🔊';s.onclick=()=>speak(text);return s;}
// 로마자(크게) + 일본어 글자(작게) + 한국어 뜻
function lineHTML(say,read,ko){
  let h=`<span class="romaji">${esc(read||say)}</span>`;
  if(say&&say!==read)h+=` <span class="jp">${esc(say)}</span>`;
  if(ko)h+=`<div class="ko">${esc(ko)}</div>`;
  return h;
}

/* ---------- 음성 합성(읽어주기) ---------- */
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices();}
loadVoices(); if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;
function speak(text){
  if(!text)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=cfg.rate;
  const v=voices.find(v=>v.lang&&v.lang.replace('_','-')==='ja-JP')||voices.find(v=>v.lang&&v.lang.toLowerCase().indexOf('ja')===0);
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* ---------- 음성 인식(말 → 글) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null, recognizing=false, lastHeard='';
if(SR){
  recog=new SR(); recog.lang='ja-JP'; recog.interimResults=true; recog.maxAlternatives=1;
  recog.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;lastHeard=t.trim();$('#hint').textContent='🎙️ '+lastHeard;};
  recog.onerror=e=>{$('#hint').textContent='인식 오류: '+e.error+' (다시 시도)';stopRec();};
  recog.onend=()=>{if(recognizing){recognizing=false;finishTurn();}};
}
function startRec(){
  if(!recog){$('#hint').textContent='이 브라우저는 음성인식 미지원 — 크롬(안드로이드)을 써보세요';return;}
  lastHeard='';recognizing=true;recog.lang='ja-JP';
  try{recog.start();}catch(e){}
  $('#micbtn').classList.add('rec');$('#micbtn').textContent='⏹️ 멈춤';$('#hint').textContent='듣는 중... 말한 뒤 멈춤을 누르세요';
}
function stopRec(){recognizing=false;try{recog.stop();}catch(e){}$('#micbtn').classList.remove('rec');$('#micbtn').textContent='🎤 시작';}

/* ---------- AI API ---------- */
async function ask(system,messages,maxTok=400){
  if(!curKey())throw new Error('NO_KEY');
  return cfg.provider==='gemini'?askGemini(system,messages,maxTok):askClaude(system,messages,maxTok);
}
async function askGemini(system,messages,maxTok){
  const model=cfg.modelGemini;
  const contents=messages.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  const gc={maxOutputTokens:maxTok,temperature:0.7,responseMimeType:'application/json'};
  if(/flash/.test(model))gc.thinkingConfig={thinkingBudget:0};
  const body={contents,generationConfig:gc};
  if(system)body.system_instruction={parts:[{text:system}]};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cfg.keyGemini)}`,{
    method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error('Gemini '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}
async function askClaude(system,messages,maxTok){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':cfg.keyClaude,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:cfg.modelClaude,max_tokens:maxTok,system,messages})});
  if(!r.ok){const t=await r.text();throw new Error('Claude '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return d.content.map(c=>c.text||'').join('');
}
function parseJSON(s){try{return JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1));}catch(e){return null;}}

/* ---------- 모드 전환 ---------- */
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{
  if(busy)return;
  document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');mode=b.dataset.mode;feed.innerHTML='';history=[];target='';
  nextTask();
});
$('#nextbtn').onclick=()=>{if(!busy)nextTask();};
$('#replaybtn').onclick=()=>{if(target)speak(target);};

/* ---------- 다음 문제 ---------- */
async function nextTask(){
  if(!curKey()){sysmsg('⚙️ 설정에서 AI 제공자 선택 후 API 키를 입력하세요. (일본어는 모든 모드에 키 필요)');$('#setpanel').classList.add('on');return;}
  if(mode==='shadow'){
    busy=true;$('#hint').textContent='문장 준비 중...';
    let j;
    try{
      const out=await ask(
        `Make ONE natural, polite spoken Japanese sentence for a Korean ${cfg.level} learner of Japanese who CANNOT read Japanese characters. Topic: ${cfg.topic}. ${cfg.level==='beginner'?'Very simple and short (about 5-9 words), です/ます form, everyday words.':'Natural and realistic, 8-14 words.'} Output ONLY JSON: {"ja":"<日本語>","romaji":"<Hepburn romaji, spaced by word>","ko":"<한국어 뜻>"}`,
        [{role:'user',content:'one sentence'}],220);
      j=parseJSON(out)||{};
    }catch(e){busy=false;return apiErr(e);}
    busy=false;
    if(!j.ja){sysmsg('문장 생성 실패. 다시 시도하세요');return;}
    tObj={say:j.ja,read:j.romaji||j.ja,ko:j.ko||''}; target=j.ja;
    add('bot','🔁 따라 말해보세요:');
    const c=document.createElement('div');c.className='card';
    c.innerHTML=lineHTML(tObj.say,tObj.read,tObj.ko);
    c.appendChild(speakIcon(tObj.say));feed.appendChild(c);scroll();
    speak(tObj.say);$('#hint').textContent='🎤를 눌러 따라 말하세요';
  }else if(mode==='express'){
    busy=true;$('#hint').textContent='주제 준비 중...';
    let ko='';
    try{
      const out=await ask(
        `Make ONE short Korean sentence for a Korean ${cfg.level} learner of Japanese to say aloud in Japanese. Topic: ${cfg.topic}. Output ONLY JSON: {"ko":"<한국어 문장>"}. ${cfg.level==='beginner'?'Very simple (5-8 words).':'Natural and realistic.'}`,
        [{role:'user',content:'one sentence'}],120);
      ko=(parseJSON(out)||{}).ko||'';
    }catch(e){busy=false;return apiErr(e);}
    busy=false;target='';
    add('bot','💡 이걸 일본어로 말해보세요:');
    add('bot','「 '+ko+' 」');
    history=[{role:'system_ko',content:ko}];
    $('#hint').textContent='🎤를 눌러 일본어로 말하세요';
  }else{ // qa
    busy=true;$('#hint').textContent='질문 준비 중...';
    let j={};
    try{
      const out=await ask(
        `You are a friendly Japanese tutor doing speaking practice with a Korean ${cfg.level} learner who CANNOT read Japanese script. Topic: ${cfg.topic}. Ask ONE short, simple spoken-Japanese question to start or continue. Output ONLY JSON: {"q":"<日本語>","romaji":"<Hepburn romaji>","ko":"<한국어 뜻>"}`,
        history.length?history.filter(h=>h.role==='user'||h.role==='assistant').map(h=>({role:h.role,content:h.content})):[{role:'user',content:'Start the conversation.'}],220);
      j=parseJSON(out)||{};
    }catch(e){busy=false;return apiErr(e);}
    busy=false;
    const q=j.q||''; target=q;
    const c=document.createElement('div');c.className='card';
    c.innerHTML='💬 '+lineHTML(q,j.romaji,j.ko);
    c.appendChild(speakIcon(q));feed.appendChild(c);scroll();
    speak(q);
    history.push({role:'assistant',content:q});
    $('#hint').textContent='🎤를 눌러 일본어로 대답하세요';
  }
}

/* ---------- 마이크 ---------- */
$('#micbtn').onclick=()=>{if(busy)return;if(recognizing)stopRec();else startRec();};

async function finishTurn(){
  stopRec();
  const heard=lastHeard.trim();
  if(!heard){$('#hint').textContent='못 들었어요. 다시 시도하세요';return;}
  add('me',heard);
  if(mode==='shadow'){ await scoreShadow(heard); return; }
  busy=true;$('#hint').textContent='피드백 생성 중...';
  try{
    let system,messages;
    if(mode==='express'){
      const ko=(history.find(h=>h.role==='system_ko')||{}).content||'';
      system=`A Korean ${cfg.level} learner of Japanese tried to say this Korean sentence in Japanese: "${ko}". Their speech was recognized as the Japanese text below (may have small recognition errors—judge leniently). The learner CANNOT read Japanese script, so ALWAYS include romaji. Reply ONLY JSON: {"ja":"<natural Japanese for the target>","romaji":"<Hepburn romaji>","saidWell":"<짧은 한국어 평>","tip":"<한국어 표현 팁 한 줄>","pron":"<한국어 발음 팁 또는 빈칸>"}`;
      messages=[{role:'user',content:heard}];
    }else{ // qa
      history.push({role:'user',content:heard});
      system=`You are a warm Japanese speaking tutor for a Korean ${cfg.level} learner who CANNOT read Japanese script. Their reply text comes from speech recognition (ignore minor typos). ALWAYS include romaji. Reply ONLY JSON: {"ja":"<a natural Japanese version of their reply>","romaji":"<Hepburn romaji>","saidWell":"<짧은 한국어 평>","pron":"<한국어 발음 팁 또는 빈칸>","next":"<your next short question in Japanese>","next_romaji":"<romaji>","next_ko":"<한국어 뜻>"}`;
      messages=history.filter(h=>h.role==='user'||h.role==='assistant').map(h=>({role:h.role,content:h.content}));
    }
    const out=await ask(system,messages,500);
    const j=parseJSON(out);
    busy=false;
    if(!j){add('bot',out);return;}
    renderFeedback(j);
    if(mode==='qa'&&j.next){
      target=j.next;history.push({role:'assistant',content:j.next});
      $('#hint').textContent='🎤로 이어서 대답하세요';
    }else{
      $('#hint').textContent='⏭️로 다음 문장, 🎤로 다시 시도';
    }
  }catch(e){apiErr(e);}
}

function renderFeedback(j){
  const c=document.createElement('div');c.className='card';
  let h='';
  if(j.ja){h+=`<div class="row"><span class="tag t-nat">자연스럽게</span><span>${lineHTML(j.ja,j.romaji,'')}</span></div>`;}
  if(j.saidWell){h+=`<div class="row"><span class="tag t-gram">평가</span><span>${esc(j.saidWell)}</span></div>`;}
  if(j.tip){h+=`<div class="row"><span class="tag t-tip">팁</span><span>${esc(j.tip)}</span></div>`;}
  if(j.pron){h+=`<div class="row"><span class="tag t-say">발음</span><span>${esc(j.pron)}</span></div>`;}
  if(j.next){h+=`<div class="row"><span class="tag t-tip">다음</span><span>${lineHTML(j.next,j.next_romaji,j.next_ko)}</span></div>`;}
  c.innerHTML=h;
  if(j.ja)c.appendChild(speakIcon(j.ja));
  feed.appendChild(c);scroll();
  if(j.next)setTimeout(()=>speak(j.next),500);
  else if(j.ja)speak(j.ja);
}

/* 섀도잉 채점: 일본어는 AI가 채점 (글자 비교가 어려움) */
async function scoreShadow(heard){
  busy=true;$('#hint').textContent='채점 중...';
  try{
    const out=await ask(
      `A Korean learner is shadowing (repeating aloud) this Japanese sentence: "${tObj.say}" (romaji: ${tObj.read}). Their attempt, transcribed by speech recognition, is: "${heard}". Rate how closely it matches from 0-100 (be encouraging; ignore minor recognition artifacts). Reply ONLY JSON: {"score":<0-100>,"comment":"<한국어 한 줄 평>"}`,
      [{role:'user',content:'score'}],150);
    const j=parseJSON(out)||{};busy=false;
    const pct=Math.max(0,Math.min(100,parseInt(j.score)||0));
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="row"><span class="tag t-nat">정확도</span><span><b>${pct}%</b></span></div>`
      +`<div class="row" style="margin-top:5px"><span class="tag t-tip">평</span><span>${esc(j.comment||'')}</span></div>`
      +`<div style="margin-top:6px">${lineHTML(tObj.say,tObj.read,tObj.ko)}</div>`;
    c.appendChild(speakIcon(tObj.say));feed.appendChild(c);scroll();
    $('#hint').textContent='🔊 다시 듣기 · 🎤 다시 · ⏭️ 다음';
  }catch(e){apiErr(e);}
}

/* ---------- 유틸 ---------- */
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function apiErr(e){
  busy=false;
  const m=String(e.message);
  if(m.includes('NO_KEY')){sysmsg('⚙️ 설정에서 API 키를 먼저 입력하세요.');$('#setpanel').classList.add('on');}
  else if(m.includes('Failed to fetch')){sysmsg('오류: 서버 연결 실패(Failed to fetch).\n• VPN/사설DNS/광고차단 끄고 재시도\n• 주소 https://nahuly.github.io/ 확인(자물쇠🔒)\n• 다른 와이파이/데이터로 시도');}
  else sysmsg('오류: '+m);
  $('#hint').textContent='다시 시도하세요';
}

/* ---------- 설정 패널 ---------- */
function fillModels(p){
  const sel=$('#model');sel.innerHTML='';
  MODELS[p].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o);});
  sel.value=p==='gemini'?cfg.modelGemini:cfg.modelClaude;
}
function syncProviderUI(){
  const p=$('#provider').value;
  $('#keylabel').textContent=(p==='gemini'?'Gemini':'Claude')+' API 키';
  $('#apikey').value=p==='gemini'?cfg.keyGemini:cfg.keyClaude;
  $('#keynote').innerHTML=p==='gemini'
    ? '<a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>에서 무료 발급. 영어 앱과 키 공유됨.'
    : '<a href="https://console.anthropic.com/" target="_blank">console.anthropic.com</a>에서 발급. 영어 앱과 키 공유됨.';
  fillModels(p);
}
$('#provider').onchange=syncProviderUI;
$('#testbtn').onclick=async()=>{
  const note=$('#testresult');note.textContent='테스트 중...';
  cfg.provider=$('#provider').value;
  const k=$('#apikey').value.trim(),m=$('#model').value;
  if(cfg.provider==='gemini'){cfg.keyGemini=k;cfg.modelGemini=m;}else{cfg.keyClaude=k;cfg.modelClaude=m;}
  try{
    const out=await ask('Reply ONLY with JSON {"ok":true}',[{role:'user',content:'ping'}],50);
    note.textContent='✅ 연결 성공! ('+cfg.provider+'/'+m+') 응답: '+out.slice(0,50);
  }catch(e){
    const msg=String(e.message);
    note.textContent='❌ '+msg+(msg.includes('Failed to fetch')?'\n→ VPN·사설DNS·광고차단 또는 잘못된 주소 가능성.':msg.includes('NO_KEY')?'\n→ 키를 입력하세요.':msg.match(/40[013]/)?'\n→ 키가 틀렸거나 권한/모델 문제.':'');
  }
};
$('#setbtn').onclick=()=>{$('#provider').value=cfg.provider;syncProviderUI();$('#level').value=cfg.level;$('#topic').value=cfg.topic;$('#setpanel').classList.add('on');};
$('#setpanel').onclick=e=>{if(e.target.id==='setpanel')e.currentTarget.classList.remove('on');};
$('#savebtn').onclick=()=>{
  cfg.provider=$('#provider').value;
  const k=$('#apikey').value.trim(),m=$('#model').value;
  if(cfg.provider==='gemini'){cfg.keyGemini=k;cfg.modelGemini=m;}else{cfg.keyClaude=k;cfg.modelClaude=m;}
  cfg.level=$('#level').value;cfg.topic=$('#topic').value;
  // 키/제공자/모델은 영어 앱과 공유(sc_*), 수준·주제는 일본어 전용(scja_*)
  localStorage.setItem('sc_provider',cfg.provider);
  localStorage.setItem('sc_key_gemini',cfg.keyGemini);localStorage.setItem('sc_key_claude',cfg.keyClaude);
  localStorage.setItem('sc_model_gemini',cfg.modelGemini);localStorage.setItem('sc_model_claude',cfg.modelClaude);
  localStorage.setItem('scja_level',cfg.level);localStorage.setItem('scja_topic',cfg.topic);
  $('#setpanel').classList.remove('on');feed.innerHTML='';history=[];nextTask();
};
$('#speedbtn').onclick=()=>{
  const speeds=[0.7,0.85,1.0];let i=speeds.indexOf(cfg.rate);i=(i+1)%speeds.length;
  cfg.rate=speeds[i];localStorage.setItem('scja_rate',cfg.rate);
  $('#speedbtn').textContent=cfg.rate>=1?'🐇':'🐢';
  $('#hint').textContent='읽기 속도: '+(cfg.rate===0.7?'느리게':cfg.rate===0.85?'보통':'빠르게');
};

/* 시작 */
sysmsg('🇯🇵 일본어 스피킹 코치 v1 — 글자 못 읽어도 OK!\n로마자 보고 소리로 따라하세요. (모든 모드 API 키 필요, 영어 앱과 공유)');
nextTask();
</script>
